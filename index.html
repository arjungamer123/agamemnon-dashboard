<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Agamemnon Is Doing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f23;
            color: #fff;
            padding: 2rem;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        .emoji { font-size: 3rem; }
        h1 { font-size: 1.5rem; font-weight: normal; margin-top: 0.5rem; color: #888; }
        .now {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .label { color: #00ff88; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .task { font-size: 1.3rem; margin: 0.5rem 0; }
        .why { color: #aaa; font-size: 0.95rem; }
        .history { margin-top: 2rem; }
        .history-title { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        .item {
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .item-when { color: #666; font-size: 0.8rem; }
        .item-what { margin-top: 0.25rem; }
        .updating { color: #666; font-size: 0.8rem; text-align: center; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="emoji">⚔️</div>
            <h1>Agamemnon</h1>
        </header>
        
        <div class="now">
            <div class="label">Working on now</div>
            <div class="task" id="current-task">Loading...</div>
            <div class="why" id="current-why">...</div>
        </div>
        
        <div class="history">
            <div class="history-title">Recent activity</div>
            <div id="recent-list">Loading...</div>
        </div>
        
        <div class="updating">Updates every 30 seconds</div>
    </div>
    
    <script>
        async function load() {
            try {
                // Fetch status.json from GitHub
                const res = await fetch('https://raw.githubusercontent.com/arjungamer123/agamemnon-dashboard/main/status.json');
                const data = await res.json();
                
                document.getElementById('current-task').textContent = data.current.task;
                document.getElementById('current-why').textContent = data.current.why;
                
                document.getElementById('recent-list').innerHTML = data.recent.map(r => 
                    '<div class="item"><div class="item-when">' + r.when + '</div><div class="item-what">' + r.task + '</div></div>'
                ).join('');
            } catch(e) {
                document.getElementById('current-task').textContent = 'Setting up dashboard';
                document.getElementById('current-why').textContent = 'Almost ready...';
            }
        }
        
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
