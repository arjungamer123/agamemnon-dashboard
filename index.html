<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Command Center</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #fff;
            padding: 1.5rem;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        .emoji { font-size: 2.5rem; }
        h1 { font-size: 1.3rem; font-weight: 600; margin-top: 0.5rem; color: #fff; }
        .subtitle { color: #666; font-size: 0.85rem; margin-top: 0.3rem; }
        
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .agent-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.2s;
        }
        
        .agent-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }
        
        .agent-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        
        .agent-icon { font-size: 1.5rem; }
        
        .agent-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }
        
        .agent-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: auto;
        }
        
        .status-working { background: #00ff88; animation: pulse 2s infinite; }
        .status-idle { background: #666; }
        .status-waiting { background: #ffaa00; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .agent-task {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }
        
        .agent-meta {
            font-size: 0.75rem;
            color: #666;
        }
        
        .ceo-status {
            background: linear-gradient(135deg, rgba(0,255,136,0.1), rgba(136,0,255,0.1));
            border: 1px solid rgba(0,255,136,0.3);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .ceo-label {
            color: #00ff88;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        
        .ceo-task {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        
        .ceo-context {
            color: #aaa;
            font-size: 0.85rem;
        }
        
        .updating {
            color: #444;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="emoji">⚔️</div>
            <h1>Agent Command Center</h1>
            <div class="subtitle">Live monitoring • Updates every 30s</div>
            <nav style="margin-top: 1rem; display: flex; gap: 1rem; justify-content: center;">
                <a href="/" style="color: #00ff88; text-decoration: none; padding: 0.5rem 1rem; background: rgba(0,255,136,0.1); border-radius: 8px; font-size: 0.85rem;">📊 Command Center</a>
                <a href="https://growth-dashboard-434.pages.dev" style="color: #888; text-decoration: none; padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 0.85rem;">🚀 Agent Plans</a>
            </nav>
        </header>
        
        <div class="ceo-status">
            <div class="ceo-label">CEO (Agamemnon)</div>
            <div class="ceo-task" id="ceo-task">Coordinating agents...</div>
            <div class="ceo-context" id="ceo-context">...</div>
        </div>
        
        <div class="agent-grid" id="agent-grid">
            <!-- Agents populated by JavaScript -->
        </div>
        
        <div class="updating">Live data from GitHub • agamemnon-dashboard.pages.dev</div>
    </div>
    
    <script>
        const agentIcons = {
            'growth-agent': '🚀',
            'grapevine-agent': '🍇',
            'competitor-agent': '👁️',
            'relationship-agent': '🤝',
            'infrastructure-agent': '🔧',
            'digest-agent': '📰'
        };
        
        const agentNames = {
            'growth-agent': 'Growth Strategist',
            'grapevine-agent': 'Grapevine',
            'competitor-agent': 'Competitor Intel',
            'relationship-agent': 'Relationships',
            'infrastructure-agent': 'Infrastructure',
            'digest-agent': 'Morning Digest'
        };
        
        async function load() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/arjungamer123/agamemnon-dashboard/main/agents-status.json?' + Date.now());
                const data = await res.json();
                
                // CEO status
                document.getElementById('ceo-task').textContent = data.ceo.task;
                document.getElementById('ceo-context').textContent = data.ceo.context;
                
                // Agent grid
                const grid = document.getElementById('agent-grid');
                grid.innerHTML = data.agents.map(agent => {
                    const icon = agentIcons[agent.id] || '🤖';
                    const name = agentNames[agent.id] || agent.id;
                    const statusClass = agent.status === 'working' ? 'status-working' : 
                                      agent.status === 'waiting' ? 'status-waiting' : 'status-idle';
                    
                    return `
                        <div class="agent-card">
                            <div class="agent-header">
                                <div class="agent-icon">${icon}</div>
                                <div class="agent-name">${name}</div>
                                <div class="agent-status ${statusClass}"></div>
                            </div>
                            <div class="agent-task">${agent.task}</div>
                            <div class="agent-meta">${agent.updated}</div>
                        </div>
                    `;
                }).join('');
            } catch(e) {
                document.getElementById('ceo-task').textContent = 'Initializing agents...';
                document.getElementById('ceo-context').textContent = 'Dashboard loading...';
            }
        }
        
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
